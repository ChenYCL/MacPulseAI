name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test & package DMG
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Run tests
        run: swift test 2>&1 | tail -5

      - name: Build release app bundle
        run: |
          ./scripts/build_app.sh
          echo "APP=build/MacPulse.app" >> "$GITHUB_ENV"

      - name: Create DMG
        id: dmg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="dev-$(date +%Y%m%d%H%M%S)"; fi
          DMG_NAME="MacPulseAI-$VERSION.dmg"
          mkdir -p dist/dmg-staging
          cp -R "$APP" dist/dmg-staging/
          ln -s /Applications dist/dmg-staging/Applications
          hdiutil create -volname "MacPulse AI $VERSION" \
            -srcfolder dist/dmg-staging \
            -ov -format UDZO "dist/$DMG_NAME"
          shasum -a 256 "dist/$DMG_NAME" > "dist/$DMG_NAME.sha256"
          echo "dmg=dist/$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=dist/$DMG_NAME.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (debugging / manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: MacPulseAI-DMG
          path: |
            ${{ steps.dmg.outputs.dmg }}
            ${{ steps.dmg.outputs.sha }}
          retention-days: 7

      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MacPulse AI ${{ github.ref_name }}
          body: |
            ## MacPulse AI ${{ github.ref_name }}

            AI 驱动的 macOS 进程管家 —— 实时监控进程瞬时 CPU、AI 安全体检与查毒、
            磁盘清理 / 应用卸载 / 启动项审计，所有破坏性操作均需人工确认（HITL）。

            ### 安装
            1. 下载下方 **MacPulseAI-*.dmg**
            2. 打开并将 **MacPulse AI** 拖入 Applications
            3. 首次打开：右键 App → 「打开」（绕过 Gatekeeper 未公证提示）

            ### 校验
            附带 `.sha256` 校验文件；Ad-hoc 签名（未公证）。
            开源免费 · 双语（中文/English） · MIT License

            **Full Changelog**: https://github.com/ChenYCL/MacPulseAI/commits/${{ github.ref_name }}
          files: |
            ${{ steps.dmg.outputs.dmg }}
            ${{ steps.dmg.outputs.sha }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
